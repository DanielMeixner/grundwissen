name: Verify and publish Grundwissen

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grundwissen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate content, typecheck and build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: npm run test:e2e
      - name: Store browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.verify.outputs.pages_artifact_name }}
